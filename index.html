<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arko — Branding Versions</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080808;
  --surface: #111111;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --t1: #ffffff;
  --t2: rgba(255,255,255,0.45);
  --t3: rgba(255,255,255,0.22);
  --accent: #E8622F;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  height: 48px;
  background: rgba(8,8,8,0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
}

.bar-logo {
  font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--t3); text-transform: uppercase; flex-shrink: 0;
  margin-right: 4px;
}

.tabs {
  display: flex; gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
}

.tab {
  font-size: 12px; font-weight: 500;
  color: var(--t2);
  padding: 5px 16px;
  border-radius: 6px;
  cursor: pointer;
  border: none; background: none;
  font-family: inherit;
  transition: background 0.12s, color 0.12s;
  white-space: nowrap;
}
.tab:hover { color: var(--t1); }
.tab.active {
  background: var(--t1);
  color: #080808;
  font-weight: 600;
}

.badge {
  font-size: 10px; font-weight: 500;
  color: var(--t3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 8px;
  letter-spacing: 0.04em;
}

.frames {
  position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
}

.frame {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
  display: none;
}
.frame.active { display: block; }
</style>
</head>
<body>

<div class="bar">
  <span class="bar-logo">Arko</span>
  <div class="tabs">
    <button class="tab active" onclick="show(0)">Landing v1</button>
    <button class="tab" onclick="show(1)">Landing v2</button>
    <button class="tab" onclick="show(2)">Brand Guide</button>
  </div>
  <span class="badge" id="badge">Elegant · Cormorant</span>
</div>

<div class="frames">
  <iframe class="frame active" src="v1-elegant.html" id="f0"></iframe>
  <iframe class="frame" src="v2-bold.html" id="f1"></iframe>
  <iframe class="frame" src="brand-guide.html" id="f2"></iframe>
</div>

<script>
const badges = ['Elegant · Cormorant', 'Bold · Unbounded', 'Brand Guidelines · Syne'];
const tabs = document.querySelectorAll('.tab');
const frames = document.querySelectorAll('.frame');
const badge = document.getElementById('badge');

function show(i) {
  tabs.forEach((t, j) => t.classList.toggle('active', j === i));
  frames.forEach((f, j) => f.classList.toggle('active', j === i));
  badge.textContent = badges[i];
}
</script>
</body>
</html>
