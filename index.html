<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arko — Branding</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080808;font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

.bar{
  position:fixed;top:0;left:0;right:0;z-index:9999;height:48px;
  background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;padding:0 20px;gap:10px;
}

.bar-logo{font-size:12px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.2);text-transform:uppercase;flex-shrink:0;margin-right:6px}

.tabs{display:flex;gap:2px;background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:3px}

.tab{
  font-size:12px;font-weight:500;color:rgba(255,255,255,0.4);
  padding:5px 18px;border-radius:6px;cursor:pointer;
  border:none;background:none;font-family:inherit;
  transition:background .12s,color .12s;white-space:nowrap;
}
.tab:hover{color:#fff}
.tab.active{background:#fff;color:#080808;font-weight:600}

.desc{font-size:11px;color:rgba(255,255,255,0.2);margin-left:4px;flex-shrink:0}

.frames{position:fixed;top:48px;left:0;right:0;bottom:0}
.frame{position:absolute;inset:0;width:100%;height:100%;border:none;display:none}
.frame.active{display:block}
</style>
</head>
<body>

<div class="bar">
  <span class="bar-logo">Arko</span>
  <div class="tabs">
    <button class="tab active" onclick="show(0)">01 · Elegant</button>
    <button class="tab" onclick="show(1)">02 · Bold</button>
    <button class="tab" onclick="show(2)">03 · Structured</button>
    <button class="tab" onclick="show(3)">04 · Industrial</button>
  </div>
  <span class="desc" id="desc">Cormorant · Geist</span>
</div>

<div class="frames">
  <iframe class="frame active" src="brand-1.html"></iframe>
  <iframe class="frame" src="brand-2.html"></iframe>
  <iframe class="frame" src="brand-3.html"></iframe>
  <iframe class="frame" src="brand-4.html"></iframe>
</div>

<script>
const descs = ['Cormorant · Geist','Unbounded · Jakarta Sans','Syne · DM Sans','Space Grotesk · Space Mono'];
const tabs = document.querySelectorAll('.tab');
const frames = document.querySelectorAll('.frame');
const desc = document.getElementById('desc');
function show(i){
  tabs.forEach((t,j)=>t.classList.toggle('active',j===i));
  frames.forEach((f,j)=>f.classList.toggle('active',j===i));
  desc.textContent=descs[i];
}
</script>
</body>
</html>
